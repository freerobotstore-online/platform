<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maze Solver Robot — FreeRobotStore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fafafa; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { font-size: 1.3rem; font-weight: 700; margin: 1.5rem 0 0.25rem; } h1 span { color: #f97316; }
    .sub { color: #737373; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; max-width: 480px; }
    canvas { border: 1px solid #262626; border-radius: 12px; }
    .controls { display: flex; gap: 0.75rem; margin: 1rem 0; flex-wrap: wrap; justify-content: center; }
    button { padding: 0.45rem 1rem; border-radius: 8px; border: 1px solid #333; background: #171717; color: #fafafa; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    button:hover { border-color: #f97316; color: #f97316; }
    button.primary { background: #f97316; border-color: #f97316; color: white; }
    select { padding: 0.4rem 0.75rem; border-radius: 8px; border: 1px solid #333; background: #171717; color: #fafafa; font-size: 0.82rem; font-family: inherit; }
    .info { font-size: 0.75rem; color: #525252; margin: 0.5rem; }
    a { color: #525252; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Maze <span>Solver</span> Robot</h1>
  <p class="sub">Watch a robot navigate a randomly generated maze using wall-following or A* pathfinding. Educational demo for navigation algorithms.</p>

  <canvas id="maze" width="600" height="600"></canvas>

  <div class="controls">
    <select id="algo">
      <option value="wall">Wall Following (Right-hand)</option>
      <option value="astar">A* Pathfinding</option>
      <option value="bfs">BFS (Breadth-first)</option>
    </select>
    <button class="primary" id="btn-solve">Solve</button>
    <button id="btn-new">New Maze</button>
    <button id="btn-speed">Speed: 1x</button>
  </div>
  <div class="info">Steps: <span id="steps">0</span> | Algorithm: <span id="algo-name">Wall Following</span> | <a href="https://freerobotstore.pages.dev">FreeRobotStore</a></div>

  <script>
    const canvas = document.getElementById('maze');
    const ctx = canvas.getContext('2d');
    const COLS = 25, ROWS = 25;
    const CELL = canvas.width / COLS;
    let grid, robot, goal, path, visited, solving, stepCount, speed;

    function initMaze() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
      visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      path = [];
      stepCount = 0;
      solving = false;
      document.getElementById('steps').textContent = '0';

      // Recursive backtracker maze generation
      const stack = [[1, 1]];
      grid[1][1] = 0;
      const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];

      while (stack.length) {
        const [cy, cx] = stack[stack.length - 1];
        const neighbors = dirs
          .map(([dy, dx]) => [cy + dy, cx + dx])
          .filter(([ny, nx]) => ny > 0 && ny < ROWS - 1 && nx > 0 && nx < COLS - 1 && grid[ny][nx] === 1);

        if (neighbors.length === 0) {
          stack.pop();
          continue;
        }
        const [ny, nx] = neighbors[Math.floor(Math.random() * neighbors.length)];
        grid[(cy + ny) / 2][(cx + nx) / 2] = 0;
        grid[ny][nx] = 0;
        stack.push([ny, nx]);
      }

      robot = { x: 1, y: 1, dir: 0 };
      goal = { x: COLS - 2, y: ROWS - 2 };
      grid[goal.y][goal.x] = 0;
    }

    function draw() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === 1) {
            ctx.fillStyle = '#1f1f1f';
            ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
          }
          if (visited[r][c]) {
            ctx.fillStyle = 'rgba(249, 115, 22, 0.08)';
            ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
          }
        }
      }

      // Path
      if (path.length > 1) {
        ctx.beginPath();
        ctx.moveTo(path[0].x * CELL + CELL / 2, path[0].y * CELL + CELL / 2);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x * CELL + CELL / 2, path[i].y * CELL + CELL / 2);
        }
        ctx.strokeStyle = 'rgba(249, 115, 22, 0.3)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // Goal
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(goal.x * CELL + CELL / 2, goal.y * CELL + CELL / 2, CELL / 3, 0, Math.PI * 2);
      ctx.fill();

      // Robot
      ctx.save();
      ctx.translate(robot.x * CELL + CELL / 2, robot.y * CELL + CELL / 2);
      ctx.rotate(robot.dir * Math.PI / 2);
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(CELL / 3, 0);
      ctx.lineTo(-CELL / 4, -CELL / 4);
      ctx.lineTo(-CELL / 4, CELL / 4);
      ctx.closePath();
      ctx.fill();
      // Sensor dots
      ctx.fillStyle = '#fb923c';
      ctx.beginPath(); ctx.arc(CELL / 3, -3, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(CELL / 3, 3, 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // A* pathfinding
    function solveStar() {
      const open = [{ x: robot.x, y: robot.y, g: 0, f: 0, parent: null }];
      const closed = new Set();

      function h(x, y) { return Math.abs(x - goal.x) + Math.abs(y - goal.y); }

      while (open.length) {
        open.sort((a, b) => a.f - b.f);
        const curr = open.shift();
        const key = `${curr.x},${curr.y}`;
        if (closed.has(key)) continue;
        closed.add(key);
        visited[curr.y][curr.x] = true;

        if (curr.x === goal.x && curr.y === goal.y) {
          const result = [];
          let n = curr;
          while (n) { result.unshift({ x: n.x, y: n.y }); n = n.parent; }
          return result;
        }

        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = curr.x + dx, ny = curr.y + dy;
          if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx] === 0 && !closed.has(`${nx},${ny}`)) {
            open.push({ x: nx, y: ny, g: curr.g + 1, f: curr.g + 1 + h(nx, ny), parent: curr });
          }
        }
      }
      return [];
    }

    // BFS
    function solveBFS() {
      const queue = [{ x: robot.x, y: robot.y, parent: null }];
      const seen = new Set([`${robot.x},${robot.y}`]);

      while (queue.length) {
        const curr = queue.shift();
        visited[curr.y][curr.x] = true;

        if (curr.x === goal.x && curr.y === goal.y) {
          const result = [];
          let n = curr;
          while (n) { result.unshift({ x: n.x, y: n.y }); n = n.parent; }
          return result;
        }

        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = curr.x + dx, ny = curr.y + dy;
          const key = `${nx},${ny}`;
          if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx] === 0 && !seen.has(key)) {
            seen.add(key);
            queue.push({ x: nx, y: ny, parent: curr });
          }
        }
      }
      return [];
    }

    // Wall following
    function solveWall() {
      const result = [{ x: robot.x, y: robot.y }];
      let cx = robot.x, cy = robot.y, dir = 0;
      const dx = [1, 0, -1, 0], dy = [0, 1, 0, -1];
      const maxSteps = COLS * ROWS * 4;

      for (let s = 0; s < maxSteps; s++) {
        if (cx === goal.x && cy === goal.y) break;
        visited[cy][cx] = true;

        // Try right, forward, left, back
        const rightDir = (dir + 3) % 4;
        const rx = cx + dx[rightDir], ry = cy + dy[rightDir];
        if (rx >= 0 && rx < COLS && ry >= 0 && ry < ROWS && grid[ry][rx] === 0) {
          dir = rightDir; cx = rx; cy = ry;
        } else {
          const fx = cx + dx[dir], fy = cy + dy[dir];
          if (fx >= 0 && fx < COLS && fy >= 0 && fy < ROWS && grid[fy][fx] === 0) {
            cx = fx; cy = fy;
          } else {
            dir = (dir + 1) % 4;
          }
        }
        result.push({ x: cx, y: cy });
      }
      return result;
    }

    let animIdx = 0, animPath = [];
    function animateSolve() {
      if (animIdx >= animPath.length) { solving = false; return; }
      const batchSize = speed;
      for (let i = 0; i < batchSize && animIdx < animPath.length; i++, animIdx++) {
        const p = animPath[animIdx];
        robot.x = p.x; robot.y = p.y;
        path.push(p);
        stepCount++;
        if (animIdx > 0) {
          const prev = animPath[animIdx - 1];
          if (p.x > prev.x) robot.dir = 0;
          else if (p.y > prev.y) robot.dir = 1;
          else if (p.x < prev.x) robot.dir = 2;
          else robot.dir = 3;
        }
      }
      document.getElementById('steps').textContent = stepCount;
      draw();
      if (robot.x === goal.x && robot.y === goal.y) { solving = false; return; }
      requestAnimationFrame(animateSolve);
    }

    document.getElementById('btn-solve').addEventListener('click', () => {
      if (solving) return;
      visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      path = [];
      stepCount = 0;
      robot = { x: 1, y: 1, dir: 0 };

      const algo = document.getElementById('algo').value;
      document.getElementById('algo-name').textContent =
        algo === 'astar' ? 'A*' : algo === 'bfs' ? 'BFS' : 'Wall Following';

      if (algo === 'astar') animPath = solveStar();
      else if (algo === 'bfs') animPath = solveBFS();
      else animPath = solveWall();

      animIdx = 0;
      solving = true;
      animateSolve();
    });

    document.getElementById('btn-new').addEventListener('click', () => {
      initMaze(); draw();
    });

    speed = 1;
    document.getElementById('btn-speed').addEventListener('click', () => {
      speed = speed === 1 ? 3 : speed === 3 ? 8 : 1;
      document.getElementById('btn-speed').textContent = `Speed: ${speed}x`;
    });

    document.getElementById('algo').addEventListener('change', (e) => {
      document.getElementById('algo-name').textContent =
        e.target.value === 'astar' ? 'A*' : e.target.value === 'bfs' ? 'BFS' : 'Wall Following';
    });

    initMaze();
    draw();
  </script>
<script src="/related.js"></script>
</body>
</html>
