<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Simulator — FreeRobotStore</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0a;color:#fafafa;font-family:'Manrope',system-ui,sans-serif;overflow:hidden}
    #app{width:100vw;height:100vh;position:relative}
    canvas{display:block}
    #hud{position:absolute;top:1rem;left:1rem;font-size:.78rem;color:#525252;z-index:10;line-height:1.7}
    #hud span{color:#f97316;font-weight:600}
    #hud .g{color:#10b981}
    #controls{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);display:flex;gap:.5rem;z-index:10;flex-wrap:wrap;justify-content:center}
    button{padding:.4rem .9rem;border-radius:8px;border:1px solid #333;background:#171717;color:#fafafa;font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit}
    button:hover{border-color:#f97316;color:#f97316}
    button.active{background:#f97316;border-color:#f97316;color:#fff}
    .key{display:inline-block;padding:.1rem .3rem;border-radius:3px;border:1px solid #404040;background:#1f1f1f;font-size:.65rem;font-family:monospace;color:#737373}
    #help{position:absolute;top:1rem;right:1rem;font-size:.7rem;color:#404040;z-index:10;text-align:right;line-height:1.8}
    a{color:#404040;text-decoration:none;position:absolute;bottom:1rem;right:1rem;font-size:.72rem;z-index:10}
  </style>
<meta name="description" content="3D quadcopter — WASD flight, hover/acro mode, ring course, wind, first-person cam, trees + landscape">
<meta property="og:title" content="Drone Simulator - FreeRobotStore">
<meta property="og:description" content="3D quadcopter — WASD flight, hover/acro mode, ring course, wind, first-person cam, trees + landscape">
<meta property="og:type" content="website">
<meta property="og:url" content="https://freerobotstore.online/robots/drone-sim/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Drone Simulator">
<meta name="twitter:description" content="3D quadcopter — WASD flight, hover/acro mode, ring course, wind, first-person cam, trees + landscape">
<link rel="canonical" href="https://freerobotstore.online/robots/drone-sim/">
</head>
<body>
<div id="app">
  <div id="hud">
    <span>Drone Simulator</span><br>
    Alt: <span id="alt">0.0</span>m | Speed: <span id="spd">0.0</span>m/s<br>
    Pitch: <span id="pitch">0</span>&deg; | Roll: <span id="roll">0</span>&deg;<br>
    Throttle: <span class="g" id="thr">0</span>% | Battery: <span class="g" id="bat">100</span>%
  </div>
  <div id="help">
    <span class="key">W</span><span class="key">↑</span> Forward
    <span class="key">S</span><span class="key">↓</span> Back<br>
    <span class="key">A</span><span class="key">←</span> Strafe left
    <span class="key">D</span><span class="key">→</span> Right<br>
    <span class="key">Space</span> Up <span class="key">Shift</span> Down
    <span class="key">Q</span><span class="key">E</span> Rotate<br>
    <span class="key">R</span> Reset
  </div>
  <div id="controls">
    <button id="btn-hover" class="active">Hover Assist</button>
    <button id="btn-acro">Acro Mode</button>
    <button id="btn-ring">Ring Course</button>
    <button id="btn-wind">Wind: Off</button>
    <button id="btn-fp">First Person</button>
  </div>
  <a href="https://freerobotstore.online">FreeRobotStore</a>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById('app').prepend(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(50, 80, 30); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
scene.add(sun);

// Ground with height variation
const groundGeo = new THREE.PlaneGeometry(300, 300, 80, 80);
const posAttr = groundGeo.attributes.position;
for(let i=0;i<posAttr.count;i++){
  const x=posAttr.getX(i), y=posAttr.getY(i);
  const h = Math.sin(x*.03)*Math.cos(y*.03)*2 + Math.sin(x*.07+1)*Math.cos(y*.05)*1;
  // Flatten center for landing pad
  const distFromCenter = Math.sqrt(x*x+y*y);
  const flat = Math.max(0, 1-distFromCenter/15);
  posAttr.setZ(i, h*(1-flat));
}
groundGeo.computeVertexNormals();
const groundMat = new THREE.MeshStandardMaterial({color:0x4a7c4f, roughness:0.9, flatShading:true});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// Water (lake)
const water = new THREE.Mesh(new THREE.CircleGeometry(25,32), new THREE.MeshStandardMaterial({color:0x1e40af, roughness:0.1, metalness:0.3, transparent:true, opacity:0.7}));
water.rotation.x = -Math.PI/2; water.position.set(50,0.1,-40); scene.add(water);

// Landing pad
const pad = new THREE.Mesh(new THREE.CylinderGeometry(3,3,0.08,32), new THREE.MeshStandardMaterial({color:0x333333}));
pad.position.y = 0.04; scene.add(pad);
const padRing = new THREE.Mesh(new THREE.RingGeometry(2,2.3,32), new THREE.MeshBasicMaterial({color:0xf97316,side:THREE.DoubleSide}));
padRing.rotation.x = -Math.PI/2; padRing.position.y = 0.09; scene.add(padRing);
// H on pad
const padH = new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.4), new THREE.MeshBasicMaterial({color:0xf97316,side:THREE.DoubleSide}));
padH.rotation.x = -Math.PI/2; padH.position.y = 0.09; scene.add(padH);

// Buildings
const buildingMat = new THREE.MeshStandardMaterial({color:0x374151,roughness:0.7});
const windowMat = new THREE.MeshStandardMaterial({color:0x60a5fa,emissive:0x1e3a5f,emissiveIntensity:0.5});
function addBuilding(x,z,w,d,h,hasArch){
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), buildingMat);
  b.position.set(x,h/2,z); b.castShadow=true; b.receiveShadow=true; scene.add(b);
  // Windows
  for(let wy=2;wy<h-1;wy+=2.5){
    for(let wx=-w/2+1;wx<w/2;wx+=2){
      const win = new THREE.Mesh(new THREE.PlaneGeometry(.8,1.2), windowMat);
      win.position.set(x+wx,wy,z+d/2+.01); scene.add(win);
      const win2 = win.clone(); win2.position.z = z-d/2-.01; win2.rotation.y=Math.PI; scene.add(win2);
    }
  }
  // Rooftop detail
  const ac = new THREE.Mesh(new THREE.BoxGeometry(1.5,.8,1), new THREE.MeshStandardMaterial({color:0x6b7280}));
  ac.position.set(x+w/4,h+.4,z); scene.add(ac);
  // Fly-through arch
  if(hasArch){
    const archW=3, archH=4;
    const arch = new THREE.Mesh(new THREE.BoxGeometry(archW,archH,d+.1), new THREE.MeshStandardMaterial({color:0x0a0a0a}));
    arch.position.set(x,archH/2,z); scene.add(arch);
    // Arch ring (visual indicator)
    const archRing = new THREE.Mesh(new THREE.TorusGeometry(1.8,.08,8,16), new THREE.MeshStandardMaterial({color:0xf97316,emissive:0xf97316,emissiveIntensity:.5}));
    archRing.position.set(x,archH/2,z-d/2-.1);
    scene.add(archRing);
    const archRing2 = archRing.clone(); archRing2.position.z = z+d/2+.1; scene.add(archRing2);
  }
}
addBuilding(-35, -25, 8, 6, 15, true);
addBuilding(-25, -30, 6, 8, 22, false);
addBuilding(-30, -18, 10, 5, 10, true);
addBuilding(40, 30, 7, 7, 18, true);
addBuilding(48, 25, 5, 9, 12, false);
// Extra buildings for a bigger city
addBuilding(-40, -35, 5, 5, 8, false);
addBuilding(55, 35, 6, 6, 25, true);
addBuilding(35, 40, 8, 5, 14, false);

// Roads
const roadMat = new THREE.MeshStandardMaterial({color:0x1f2937, roughness:0.8});
const road1 = new THREE.Mesh(new THREE.PlaneGeometry(4,200), roadMat);
road1.rotation.x=-Math.PI/2; road1.position.set(-30,.02,0); scene.add(road1);
const road2 = new THREE.Mesh(new THREE.PlaneGeometry(200,4), roadMat);
road2.rotation.x=-Math.PI/2; road2.position.set(0,.02,-25); scene.add(road2);
// Road markings
for(let i=-100;i<100;i+=8){
  const mark = new THREE.Mesh(new THREE.PlaneGeometry(.3,3), new THREE.MeshBasicMaterial({color:0xfbbf24}));
  mark.rotation.x=-Math.PI/2; mark.position.set(-30,.03,i); scene.add(mark);
}

// Trees (more varied)
const treeColors = [0x166534,0x15803d,0x22c55e,0x14532d];
for(let i=0;i<60;i++){
  const h = 2+Math.random()*5;
  const x = (Math.random()-.5)*200, z = (Math.random()-.5)*200;
  if(Math.abs(x)<12 && Math.abs(z)<12) continue; // clear pad
  if(Math.abs(x+30)<6 && Math.abs(z)<100) continue; // clear road
  if(Math.abs(x-50)<30 && Math.abs(z+40)<30) continue; // clear lake
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,h,5), new THREE.MeshStandardMaterial({color:0x8B4513}));
  const crownColor = treeColors[Math.floor(Math.random()*treeColors.length)];
  const crown = Math.random()>.5 ?
    new THREE.Mesh(new THREE.ConeGeometry(.8+Math.random()*.8,h*.5,6), new THREE.MeshStandardMaterial({color:crownColor})) :
    new THREE.Mesh(new THREE.SphereGeometry(.8+Math.random()*.6,6,5), new THREE.MeshStandardMaterial({color:crownColor}));
  trunk.position.set(x,h/2,z); crown.position.set(x,h*.85,z);
  trunk.castShadow=true; crown.castShadow=true;
  scene.add(trunk,crown);
}

// Rocks
for(let i=0;i<20;i++){
  const r = .5+Math.random()*1.5;
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(r,0), new THREE.MeshStandardMaterial({color:0x6b7280,roughness:0.9,flatShading:true}));
  rock.position.set((Math.random()-.5)*150, r*.4, (Math.random()-.5)*150);
  rock.rotation.set(Math.random(),Math.random(),Math.random());
  rock.castShadow=true; scene.add(rock);
}

// Clouds
for(let i=0;i<8;i++){
  const cloudGroup = new THREE.Group();
  for(let j=0;j<3+Math.random()*3;j++){
    const c = new THREE.Mesh(new THREE.SphereGeometry(3+Math.random()*4,6,5), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.15}));
    c.position.set(j*4-6,0,(Math.random()-.5)*4);
    c.scale.y = 0.4;
    cloudGroup.add(c);
  }
  cloudGroup.position.set((Math.random()-.5)*200, 40+Math.random()*15, (Math.random()-.5)*200);
  scene.add(cloudGroup);
}

// Rings (course)
const rings = [];
function createRings(){
  rings.forEach(r=>scene.remove(r));
  rings.length=0;
  const pts = [[15,8,0],[30,12,15],[20,6,-20],[-10,15,25],[-25,8,-10],[0,10,-30],[25,5,20],[-15,12,0]];
  pts.forEach(([x,y,z])=>{
    const ring = new THREE.Mesh(new THREE.TorusGeometry(2.5,.15,8,24), new THREE.MeshStandardMaterial({color:0xf97316,emissive:0xf97316,emissiveIntensity:.3}));
    ring.position.set(x,y,z);
    ring.lookAt(0,y,0);
    ring.userData.passed=false;
    scene.add(ring);
    rings.push(ring);
  });
}

// Drone
const droneGroup = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(.6,.15,.6), new THREE.MeshStandardMaterial({color:0x333333,metalness:.6,roughness:.3}));
body.castShadow=true; droneGroup.add(body);

const armMat = new THREE.MeshStandardMaterial({color:0xf97316,metalness:.4});
const propMat = new THREE.MeshStandardMaterial({color:0x666,metalness:.8});
const arms = [], props = [];
for(let i=0;i<4;i++){
  const angle = i*Math.PI/2 + Math.PI/4;
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.7,6), armMat);
  arm.rotation.z = Math.PI/2;
  arm.position.set(Math.cos(angle)*.35, 0, Math.sin(angle)*.35);
  arm.lookAt(0,0,0); arm.rotateX(Math.PI/2);
  droneGroup.add(arm);
  arms.push(arm);

  const prop = new THREE.Mesh(new THREE.BoxGeometry(.4,.02,.06), propMat);
  prop.position.set(Math.cos(angle)*.5, .08, Math.sin(angle)*.5);
  droneGroup.add(prop);
  props.push(prop);

  const motor = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.06,8), new THREE.MeshStandardMaterial({color:0x444}));
  motor.position.copy(prop.position); motor.position.y = .04;
  droneGroup.add(motor);
}

// Camera on drone
const fpCam = new THREE.Mesh(new THREE.BoxGeometry(.08,.05,.05), new THREE.MeshStandardMaterial({color:0x3b82f6}));
fpCam.position.set(0,-.05,.3); droneGroup.add(fpCam);

// LED
const led = new THREE.PointLight(0x10b981, .5, 3);
led.position.set(0,-.1,0); droneGroup.add(led);

droneGroup.position.set(0, .5, 0);
scene.add(droneGroup);

// Shadow circle
const shadowGeo = new THREE.CircleGeometry(.5, 16);
const shadowMat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:.2});
const droneShadow = new THREE.Mesh(shadowGeo, shadowMat);
droneShadow.rotation.x = -Math.PI/2; droneShadow.position.y = .01;
scene.add(droneShadow);

// Physics state
let drone = {x:0, y:.5, z:0, vx:0, vy:0, vz:0, pitch:0, roll:0, yaw:0, vPitch:0, vRoll:0, vYaw:0, throttle:0};
let hoverAssist = true, firstPerson = false, windEnabled = false, battery = 100, ringsVisible = false;
let ringsPassed = 0;

const keys = {};
addEventListener('keydown', e=>{keys[e.key.toLowerCase()]=true; keys[e.code]=true; if(e.key===' ')e.preventDefault();});
addEventListener('keyup', e=>{keys[e.key.toLowerCase()]=false; keys[e.code]=false;});

document.getElementById('btn-hover').addEventListener('click', ()=>{ hoverAssist=true; document.getElementById('btn-hover').classList.add('active'); document.getElementById('btn-acro').classList.remove('active'); });
document.getElementById('btn-acro').addEventListener('click', ()=>{ hoverAssist=false; document.getElementById('btn-acro').classList.add('active'); document.getElementById('btn-hover').classList.remove('active'); });
document.getElementById('btn-ring').addEventListener('click', ()=>{ ringsVisible=!ringsVisible; if(ringsVisible){createRings(); ringsPassed=0;} else{rings.forEach(r=>scene.remove(r)); rings.length=0;} });
document.getElementById('btn-wind').addEventListener('click', function(){ windEnabled=!windEnabled; this.textContent=`Wind: ${windEnabled?'On':'Off'}`; });
document.getElementById('btn-fp').addEventListener('click', function(){ firstPerson=!firstPerson; this.classList.toggle('active'); });

function resetDrone(){
  drone = {x:0, y:.5, z:0, vx:0, vy:0, vz:0, pitch:0, roll:0, yaw:0, vPitch:0, vRoll:0, vYaw:0, throttle:0};
  battery = 100;
}

const dt = 1/60, gravity = -9.81;

function physics(){
  if(keys.r || keys.R) resetDrone();

  // Throttle: Space=up, Shift=down
  if(keys[' '] || keys.Space) drone.throttle = Math.min(100, drone.throttle + 2.5);
  else if(keys.shift || keys.Shift || keys.ShiftLeft) drone.throttle = Math.max(0, drone.throttle - 2.5);
  else if(hoverAssist && drone.y > 1) drone.throttle += (52 - drone.throttle) * .03;

  // Movement: WASD/Arrows = forward/back/strafe, Q/E = yaw (slow rotation)
  const fwd = (keys.w||keys.arrowup?1:0) - (keys.s||keys.arrowdown?1:0);
  const strafe = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  const yawIn = (keys.e?1:0) - (keys.q?1:0);

  // Yaw rotation (slow and smooth)
  drone.vYaw += (yawIn * 1.5 - drone.vYaw * 3) * dt;
  drone.yaw += drone.vYaw;

  // Convert WASD to world-space velocity along drone's facing direction
  const cy = Math.cos(drone.yaw), sy = Math.sin(drone.yaw);
  const moveSpeed = 0.8;
  const targetVx = (fwd * sy + strafe * cy) * moveSpeed;
  const targetVz = (fwd * cy - strafe * sy) * moveSpeed;

  if(hoverAssist){
    // Smooth acceleration toward target velocity
    drone.vx += (targetVx - drone.vx) * 0.08;
    drone.vz += (targetVz - drone.vz) * 0.08;
    // Tilt drone visually based on movement (cosmetic, not physics-driven)
    const targetPitch = -fwd * 0.2;
    const targetRoll = strafe * 0.15;
    drone.pitch += (targetPitch - drone.pitch) * 0.08;
    drone.roll += (targetRoll - drone.roll) * 0.08;
  } else {
    // Acro: pitch/roll controls thrust direction (original behavior but faster)
    const pitchIn = fwd;
    const rollIn = strafe;
    drone.vPitch += pitchIn * 3 * dt;
    drone.vRoll += rollIn * 3 * dt;
    drone.vPitch *= .97; drone.vRoll *= .97;
    drone.pitch += drone.vPitch;
    drone.roll += drone.vRoll;
    const cp=Math.cos(drone.pitch), sp=Math.sin(drone.pitch);
    const cr=Math.cos(drone.roll), sr=Math.sin(drone.roll);
    const thrust = drone.throttle / 100 * 20;
    drone.vx += (-thrust * sp * cy + thrust * sr * sy) * dt;
    drone.vz += (-thrust * sp * sy - thrust * sr * cy) * dt;
  }

  // Vertical thrust
  const thrust = drone.throttle / 100 * 18;
  drone.vy += (thrust * Math.cos(drone.pitch) * Math.cos(drone.roll) + gravity) * dt;

  // Wind
  if(windEnabled){
    const wt = performance.now() * .001;
    drone.vx += Math.sin(wt * .7) * .015;
    drone.vz += Math.cos(wt * .5) * .01;
  }

  // Drag
  drone.vx *= .985; drone.vy *= .995; drone.vz *= .985;

  drone.x += drone.vx;
  drone.y += drone.vy * dt;
  drone.z += drone.vz;

  // Ground
  if(drone.y < .3){
    drone.y = .3; drone.vy = Math.max(0, drone.vy);
    drone.vx *= .85; drone.vz *= .85;
    if(hoverAssist){ drone.pitch *= .9; drone.roll *= .9; }
  }

  // Ceiling
  if(drone.y > 60) { drone.y = 60; drone.vy = 0; }

  // Battery
  battery = Math.max(0, battery - drone.throttle * .0003);

  // Ring collision
  for(const ring of rings){
    if(ring.userData.passed) continue;
    const d = new THREE.Vector3(drone.x, drone.y, drone.z).distanceTo(ring.position);
    if(d < 3){
      ring.userData.passed = true;
      ring.material.color.set(0x10b981);
      ring.material.emissive.set(0x10b981);
      ringsPassed++;
    }
  }

  // Update HUD
  document.getElementById('alt').textContent = drone.y.toFixed(1);
  document.getElementById('spd').textContent = Math.sqrt(drone.vx**2+drone.vz**2).toFixed(1);
  document.getElementById('pitch').textContent = Math.round(drone.pitch*180/Math.PI);
  document.getElementById('roll').textContent = Math.round(drone.roll*180/Math.PI);
  document.getElementById('thr').textContent = Math.round(drone.throttle);
  document.getElementById('bat').textContent = Math.round(battery);
}

function animate(){
  requestAnimationFrame(animate);
  physics();

  // Update drone mesh
  droneGroup.position.set(drone.x, drone.y, drone.z);
  droneGroup.rotation.set(drone.pitch, drone.yaw, drone.roll);

  // Spin props
  const propSpeed = drone.throttle * .01 + .05;
  props.forEach(p => p.rotation.y += propSpeed);

  // LED color based on throttle
  led.color.set(drone.throttle > 10 ? 0x10b981 : 0xef4444);

  // Shadow
  droneShadow.position.set(drone.x, .01, drone.z);
  droneShadow.scale.setScalar(Math.max(.2, 1 - drone.y * .02));

  // Camera
  if(firstPerson){
    const fwd = new THREE.Vector3(0,0,1).applyQuaternion(droneGroup.quaternion);
    camera.position.set(drone.x, drone.y, drone.z);
    camera.lookAt(drone.x+fwd.x*10, drone.y+fwd.y*10, drone.z+fwd.z*10);
  } else {
    const camDist = 8 + drone.y * .3;
    camera.position.set(drone.x - Math.sin(drone.yaw)*camDist, drone.y + 3 + drone.y*.2, drone.z - Math.cos(drone.yaw)*camDist);
    camera.lookAt(drone.x, drone.y, drone.z);
  }

  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
<script src="/related.js"></script>
</body>
