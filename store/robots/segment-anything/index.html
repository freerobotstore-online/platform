<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segment Anything — FreeRobotStore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fafafa; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { font-size: 1.3rem; font-weight: 700; margin: 1.5rem 0 0.25rem; }
    h1 span { color: #f97316; }
    .subtitle { color: #737373; font-size: 0.85rem; margin-bottom: 0.75rem; text-align: center; max-width: 520px; padding: 0 1rem; }
    .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 6px; font-size: 0.72rem; font-weight: 600; background: rgba(249,115,22,0.15); color: #fb923c; margin: 0.25rem; }
    #status { color: #f97316; font-size: 0.85rem; margin: 0.75rem 0; min-height: 1.2em; text-align: center; }
    .canvas-wrap { position: relative; display: inline-block; margin: 0.5rem; cursor: crosshair; }
    .canvas-wrap canvas { border-radius: 12px; border: 1px solid #262626; display: block; max-width: 90vw; }
    .controls { display: flex; gap: 0.75rem; margin: 1rem 0; flex-wrap: wrap; justify-content: center; }
    button { padding: 0.5rem 1.25rem; border-radius: 10px; border: 1px solid #333; background: #171717; color: #fafafa; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: border-color 0.15s, color 0.15s; }
    button:hover { border-color: #f97316; color: #f97316; }
    button.primary { background: #f97316; border-color: #f97316; color: white; }
    button.primary:hover { background: #ea580c; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .stats { font-size: 0.78rem; color: #525252; margin: 0.5rem 0; }
    .stats .val { color: #a3a3a3; }
    a { color: #525252; text-decoration: none; } a:hover { color: #737373; }
    .presets { display: flex; gap: 0.5rem; margin: 0.5rem 0; flex-wrap: wrap; justify-content: center; }
    .preset-btn { width: 64px; height: 48px; border-radius: 8px; border: 2px solid #262626; cursor: pointer; overflow: hidden; padding: 0; background: #171717; transition: border-color 0.15s; }
    .preset-btn:hover { border-color: #f97316; }
    .preset-btn canvas { width: 100%; height: 100%; display: block; }
    .hint { font-size: 0.72rem; color: #525252; margin-top: 0.25rem; }
    input[type="file"] { display: none; }
    .progress-bar { width: 300px; max-width: 80vw; height: 4px; background: #262626; border-radius: 2px; margin: 0.5rem 0; overflow: hidden; display: none; }
    .progress-bar .fill { height: 100%; background: #f97316; width: 0%; transition: width 0.3s; border-radius: 2px; }
    .click-marker { position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid white; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <h1>Segment <span>Anything</span></h1>
  <p class="subtitle">Click anywhere on an image to segment objects. Runs Meta's SAM model entirely in your browser via Transformers.js — no server needed.</p>
  <div><span class="badge">SAM</span><span class="badge">ONNX</span><span class="badge">Transformers.js</span></div>
  <div id="status">Load model to begin</div>
  <div class="progress-bar" id="progress"><div class="fill" id="progress-fill"></div></div>

  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>

  <div class="controls">
    <button class="primary" id="btn-load">Load Model (~50MB)</button>
    <button id="btn-upload" disabled>Upload Image</button>
    <button id="btn-webcam" disabled>Use Webcam</button>
    <button id="btn-clear" disabled>Clear Masks</button>
  </div>

  <p class="hint" id="preset-label" style="display:none">Or try a preset image:</p>
  <div class="presets" id="presets"></div>

  <div class="stats">
    Segments: <span class="val" id="seg-count">0</span> |
    Mask area: <span class="val" id="mask-area">-</span>% |
    Inference: <span class="val" id="inf-time">-</span>ms |
    <a href="https://freerobotstore.pages.dev">FreeRobotStore</a>
  </div>

  <input type="file" id="file-input" accept="image/*">

  <script type="module">
    import { SamModel, AutoProcessor, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('canvas-wrap');
    const statusEl = document.getElementById('status');
    const segCountEl = document.getElementById('seg-count');
    const maskAreaEl = document.getElementById('mask-area');
    const infTimeEl = document.getElementById('inf-time');
    const progressBar = document.getElementById('progress');
    const progressFill = document.getElementById('progress-fill');
    const fileInput = document.getElementById('file-input');

    const btnLoad = document.getElementById('btn-load');
    const btnUpload = document.getElementById('btn-upload');
    const btnWebcam = document.getElementById('btn-webcam');
    const btnClear = document.getElementById('btn-clear');

    let processor = null;
    let model = null;
    let imageEmbeddings = null;
    let currentImage = null;
    let clicks = [];
    let masks = [];
    let modelReady = false;
    let processing = false;

    // Segment colors with transparency
    const COLORS = [
      [249, 115, 22, 140],  // orange
      [59, 130, 246, 140],  // blue
      [16, 185, 129, 140],  // green
      [168, 85, 247, 140],  // purple
      [236, 72, 153, 140],  // pink
      [234, 179, 8, 140],   // yellow
      [6, 182, 212, 140],   // cyan
      [239, 68, 68, 140],   // red
    ];

    // Generate preset images (shapes on colored backgrounds)
    function generatePresets() {
      const presetConfigs = [
        { bg: '#1a1a2e', shapes: [
          { type: 'circle', x: 120, y: 80, r: 50, color: '#e94560' },
          { type: 'rect', x: 220, y: 40, w: 80, h: 100, color: '#0f3460' },
          { type: 'triangle', x: 60, y: 50, s: 60, color: '#16213e' },
        ]},
        { bg: '#2d3436', shapes: [
          { type: 'circle', x: 80, y: 70, r: 40, color: '#00b894' },
          { type: 'circle', x: 200, y: 90, r: 55, color: '#6c5ce7' },
          { type: 'rect', x: 130, y: 30, w: 60, h: 90, color: '#fdcb6e' },
        ]},
        { bg: '#0c0c1d', shapes: [
          { type: 'rect', x: 40, y: 30, w: 100, h: 70, color: '#e17055' },
          { type: 'rect', x: 180, y: 50, w: 80, h: 80, color: '#74b9ff' },
          { type: 'circle', x: 150, y: 110, r: 30, color: '#55efc4' },
        ]},
        { bg: '#1b1b2f', shapes: [
          { type: 'circle', x: 100, y: 75, r: 60, color: '#e94560' },
          { type: 'triangle', x: 220, y: 40, s: 80, color: '#f9ed69' },
          { type: 'rect', x: 30, y: 90, w: 50, h: 50, color: '#08d9d6' },
        ]},
      ];

      const container = document.getElementById('presets');
      const label = document.getElementById('preset-label');

      presetConfigs.forEach((cfg, idx) => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        const c = document.createElement('canvas');
        c.width = 320; c.height = 160;
        const pc = c.getContext('2d');

        pc.fillStyle = cfg.bg;
        pc.fillRect(0, 0, 320, 160);

        cfg.shapes.forEach(s => {
          pc.fillStyle = s.color;
          if (s.type === 'circle') {
            pc.beginPath(); pc.arc(s.x, s.y, s.r, 0, Math.PI * 2); pc.fill();
          } else if (s.type === 'rect') {
            pc.fillRect(s.x, s.y, s.w, s.h);
          } else if (s.type === 'triangle') {
            pc.beginPath();
            pc.moveTo(s.x, s.y);
            pc.lineTo(s.x + s.s, s.y + s.s);
            pc.lineTo(s.x - s.s, s.y + s.s);
            pc.closePath(); pc.fill();
          }
        });

        btn.appendChild(c);
        btn.addEventListener('click', () => loadPresetImage(c));
        container.appendChild(btn);
      });
    }

    async function loadPresetImage(presetCanvas) {
      if (!modelReady) return;
      const blob = await new Promise(r => presetCanvas.toBlob(r, 'image/png'));
      const url = URL.createObjectURL(blob);
      await loadImageFromURL(url);
      URL.revokeObjectURL(url);
    }

    async function loadImageFromURL(url) {
      clearMasks();
      statusEl.textContent = 'Loading image...';

      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });

      // Fit image to canvas, max 640px wide
      const maxW = Math.min(640, window.innerWidth * 0.9);
      const scale = Math.min(maxW / img.width, 480 / img.height, 1);
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      currentImage = canvas.toDataURL('image/png');

      statusEl.textContent = 'Computing image embeddings...';
      const rawImage = await RawImage.fromURL(currentImage);
      const inputs = await processor(rawImage);
      imageEmbeddings = await model.get_image_embeddings(inputs);
      currentImage = rawImage;

      statusEl.textContent = 'Click on the image to segment objects';
      btnClear.disabled = false;

      // Store original image data for redrawing
      canvas._origData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    // Load model
    btnLoad.addEventListener('click', async () => {
      btnLoad.disabled = true;
      statusEl.textContent = 'Downloading model (~50MB, first time only)...';
      progressBar.style.display = 'block';

      // Simulate progress (we can't get real download progress from Transformers.js easily)
      let pct = 0;
      const progressInterval = setInterval(() => {
        pct = Math.min(pct + Math.random() * 8, 90);
        progressFill.style.width = pct + '%';
      }, 500);

      try {
        processor = await AutoProcessor.from_pretrained('Xenova/slimsam-77-uniform');
        progressFill.style.width = '70%';
        model = await SamModel.from_pretrained('Xenova/slimsam-77-uniform');

        clearInterval(progressInterval);
        progressFill.style.width = '100%';
        setTimeout(() => { progressBar.style.display = 'none'; }, 500);

        modelReady = true;
        btnUpload.disabled = false;
        btnWebcam.disabled = false;
        statusEl.textContent = 'Model loaded. Upload an image or pick a preset to start segmenting.';
        btnLoad.textContent = 'Model Ready';

        // Show presets
        document.getElementById('preset-label').style.display = '';
        generatePresets();
      } catch (e) {
        clearInterval(progressInterval);
        progressBar.style.display = 'none';
        statusEl.textContent = 'Error loading model: ' + e.message;
        btnLoad.disabled = false;
        btnLoad.textContent = 'Retry Load';
      }
    });

    // Upload
    btnUpload.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      await loadImageFromURL(url);
      URL.revokeObjectURL(url);
      fileInput.value = '';
    });

    // Webcam capture
    btnWebcam.addEventListener('click', async () => {
      try {
        statusEl.textContent = 'Opening camera...';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: 'environment' }
        });
        const video = document.createElement('video');
        video.srcObject = stream;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        await video.play();

        // Wait a moment for the camera to stabilize
        await new Promise(r => setTimeout(r, 500));

        const tmpCanvas = document.createElement('canvas');
        tmpCanvas.width = video.videoWidth;
        tmpCanvas.height = video.videoHeight;
        tmpCanvas.getContext('2d').drawImage(video, 0, 0);
        stream.getTracks().forEach(t => t.stop());

        const blob = await new Promise(r => tmpCanvas.toBlob(r, 'image/png'));
        const url = URL.createObjectURL(blob);
        await loadImageFromURL(url);
        URL.revokeObjectURL(url);
      } catch (e) {
        statusEl.textContent = 'Camera error: ' + e.message;
      }
    });

    // Clear masks
    function clearMasks() {
      clicks = [];
      masks = [];
      // Remove click markers
      wrap.querySelectorAll('.click-marker').forEach(m => m.remove());
      segCountEl.textContent = '0';
      maskAreaEl.textContent = '-';
      infTimeEl.textContent = '-';
      if (canvas._origData) {
        ctx.putImageData(canvas._origData, 0, 0);
      }
    }
    btnClear.addEventListener('click', clearMasks);

    // Click to segment
    canvas.addEventListener('click', async (e) => {
      if (!modelReady || !currentImage || processing) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      clicks.push([x, y]);

      // Add visual click marker
      const marker = document.createElement('div');
      marker.className = 'click-marker';
      const colorIdx = (clicks.length - 1) % COLORS.length;
      const c = COLORS[colorIdx];
      marker.style.borderColor = `rgb(${c[0]},${c[1]},${c[2]})`;
      marker.style.background = `rgba(${c[0]},${c[1]},${c[2]},0.4)`;
      marker.style.left = (e.clientX - rect.left) + 'px';
      marker.style.top = (e.clientY - rect.top) + 'px';
      wrap.appendChild(marker);

      processing = true;
      statusEl.textContent = `Segmenting point ${clicks.length}...`;

      try {
        const t0 = performance.now();

        // Run segmentation for this click point
        const inputs = await processor(currentImage, {
          input_points: [[[x, y]]],
        });

        // Use pre-computed embeddings
        const outputs = await model({
          ...imageEmbeddings,
          input_points: inputs.input_points,
        });

        const maskData = await processor.post_process_masks(
          outputs.pred_masks,
          inputs.original_sizes,
          inputs.reshaped_input_sizes
        );

        const elapsed = Math.round(performance.now() - t0);
        infTimeEl.textContent = elapsed;

        // Get the mask (first mask, first batch)
        const mask = maskData[0][0];
        masks.push({ mask, colorIdx });

        // Redraw
        redrawWithMasks();

        segCountEl.textContent = masks.length;
        statusEl.textContent = `${masks.length} segment${masks.length > 1 ? 's' : ''} — click to add more`;
      } catch (e) {
        statusEl.textContent = 'Segmentation error: ' + e.message;
        console.error(e);
      }
      processing = false;
    });

    function redrawWithMasks() {
      // Restore original image
      if (canvas._origData) {
        ctx.putImageData(canvas._origData, 0, 0);
      }

      let totalMaskPixels = 0;
      const totalPixels = canvas.width * canvas.height;

      // Draw each mask as overlay
      for (const { mask, colorIdx } of masks) {
        const color = COLORS[colorIdx];
        const overlay = ctx.createImageData(canvas.width, canvas.height);

        // mask is a Tensor — extract the best mask (index 0)
        const maskTensor = mask.data ? mask : mask[0];
        const maskH = maskTensor.dims ? maskTensor.dims[maskTensor.dims.length - 2] : canvas.height;
        const maskW = maskTensor.dims ? maskTensor.dims[maskTensor.dims.length - 1] : canvas.width;
        const data = maskTensor.data;

        // The mask may have multiple candidates; use the one with highest score
        // For SlimSAM, pred_masks shape is [1, 1, 3, H, W] — 3 mask candidates
        // We take the first candidate (best)
        const singleMaskSize = maskH * maskW;
        const offset = 0; // first mask candidate

        let maskPixelCount = 0;
        for (let py = 0; py < canvas.height; py++) {
          for (let px = 0; px < canvas.width; px++) {
            // Map canvas coords to mask coords
            const my = Math.floor(py * maskH / canvas.height);
            const mx = Math.floor(px * maskW / canvas.width);
            const idx = offset + my * maskW + mx;

            if (data[idx] > 0) {
              const oi = (py * canvas.width + px) * 4;
              overlay.data[oi] = color[0];
              overlay.data[oi + 1] = color[1];
              overlay.data[oi + 2] = color[2];
              overlay.data[oi + 3] = color[3];
              maskPixelCount++;
            }
          }
        }

        totalMaskPixels += maskPixelCount;

        // Composite overlay
        const tmpCanvas = document.createElement('canvas');
        tmpCanvas.width = canvas.width;
        tmpCanvas.height = canvas.height;
        const tmpCtx = tmpCanvas.getContext('2d');
        tmpCtx.putImageData(overlay, 0, 0);
        ctx.drawImage(tmpCanvas, 0, 0);

        // Draw mask border
        ctx.strokeStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
        ctx.lineWidth = 2;
        drawMaskBorder(ctx, data, maskW, maskH, canvas.width, canvas.height, offset);
      }

      maskAreaEl.textContent = ((totalMaskPixels / totalPixels) * 100).toFixed(1);
    }

    function drawMaskBorder(ctx, data, maskW, maskH, canvasW, canvasH, offset) {
      // Simple edge detection: mark pixels that border a non-mask pixel
      const step = 3; // sample every N pixels for performance
      ctx.beginPath();
      for (let py = 0; py < canvasH; py += step) {
        for (let px = 0; px < canvasW; px += step) {
          const my = Math.floor(py * maskH / canvasH);
          const mx = Math.floor(px * maskW / canvasW);
          const idx = offset + my * maskW + mx;
          if (data[idx] <= 0) continue;

          // Check 4-neighbors
          let isBorder = false;
          for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const nx = mx + dx;
            const ny = my + dy;
            if (nx < 0 || nx >= maskW || ny < 0 || ny >= maskH) { isBorder = true; break; }
            if (data[offset + ny * maskW + nx] <= 0) { isBorder = true; break; }
          }

          if (isBorder) {
            ctx.rect(px, py, step, step);
          }
        }
      }
      ctx.fill();
    }
  </script>
<script src="/related.js"></script>
</body>
</html>
