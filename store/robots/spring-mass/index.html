<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soft Body Robot — FreeRobotStore</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0a;color:#fafafa;font-family:'Manrope',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
    h1{font-size:1.3rem;font-weight:700;margin:1.5rem 0 .25rem} h1 span{color:#f97316}
    .sub{color:#737373;font-size:.85rem;margin-bottom:.75rem;text-align:center;max-width:520px}
    canvas{border:1px solid #262626;border-radius:12px;cursor:grab}
    canvas:active{cursor:grabbing}
    .controls{display:flex;gap:.75rem;margin:1rem 0;flex-wrap:wrap;justify-content:center;align-items:center}
    label{font-size:.82rem;color:#a3a3a3;display:flex;align-items:center;gap:.4rem}
    input[type=range]{width:80px;accent-color:#f97316}
    .val{color:#f97316;font-weight:600;min-width:2.5rem}
    button{padding:.4rem 1rem;border-radius:8px;border:1px solid #333;background:#171717;color:#fafafa;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
    button:hover{border-color:#f97316;color:#f97316}
    .info{font-size:.75rem;color:#525252;margin:.5rem}
    a{color:#525252;text-decoration:none}
  </style>
</head>
<body>
  <h1>Soft Body <span>Robot</span></h1>
  <p class="sub">Spring-mass simulation of a deformable robot. Click and drag to grab nodes. Adjust stiffness, damping, and gravity. Watch it bounce, stretch, and wobble.</p>

  <canvas id="sim" width="800" height="500"></canvas>

  <div class="controls">
    <label>Stiffness <input type="range" id="stiff" min="50" max="800" value="300"><span class="val" id="stiff-v">300</span></label>
    <label>Damping <input type="range" id="damp" min="1" max="30" value="8"><span class="val" id="damp-v">8</span></label>
    <label>Gravity <input type="range" id="grav" min="0" max="2000" value="600"><span class="val" id="grav-v">600</span></label>
    <button id="btn-drop">Drop</button>
    <button id="btn-throw">Throw</button>
    <button id="btn-shape">Shape: Blob</button>
    <button id="btn-reset">Reset</button>
  </div>
  <div class="info">Drag nodes with mouse. Right-click to pin/unpin. | <a href="https://freerobotstore.pages.dev">FreeRobotStore</a></div>

  <script>
    const canvas = document.getElementById('sim');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    let nodes = [], springs = [], grabbed = null, shapeIdx = 0;
    const shapes = ['blob', 'worm', 'wheel', 'cube'];
    const groundY = H - 40;

    function sl(id) { return document.getElementById(id); }
    const stiffEl = sl('stiff'), dampEl = sl('damp'), gravEl = sl('grav');
    stiffEl.addEventListener('input', () => sl('stiff-v').textContent = stiffEl.value);
    dampEl.addEventListener('input', () => sl('damp-v').textContent = dampEl.value);
    gravEl.addEventListener('input', () => sl('grav-v').textContent = gravEl.value);

    function createBlob(cx, cy) {
      nodes = []; springs = [];
      const n = 12, r = 40;
      // Outer ring
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        nodes.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: 0, vy: 0, pinned: false, mass: 1 });
      }
      // Center
      nodes.push({ x: cx, y: cy, vx: 0, vy: 0, pinned: false, mass: 2 });
      const center = nodes.length - 1;
      // Ring springs
      for (let i = 0; i < n; i++) {
        springs.push({ a: i, b: (i + 1) % n });
        springs.push({ a: i, b: center });
        springs.push({ a: i, b: (i + 2) % n }); // cross-bracing
      }
    }

    function createWorm(cx, cy) {
      nodes = []; springs = [];
      const segs = 10;
      for (let i = 0; i < segs; i++) {
        nodes.push({ x: cx + i * 20, y: cy - 8, vx: 0, vy: 0, pinned: false, mass: 1 });
        nodes.push({ x: cx + i * 20, y: cy + 8, vx: 0, vy: 0, pinned: false, mass: 1 });
      }
      for (let i = 0; i < segs; i++) {
        const t = i * 2, b = i * 2 + 1;
        springs.push({ a: t, b: b }); // vertical
        if (i < segs - 1) {
          springs.push({ a: t, b: t + 2 }); // horizontal top
          springs.push({ a: b, b: b + 2 }); // horizontal bottom
          springs.push({ a: t, b: b + 2 }); // cross
          springs.push({ a: b, b: t + 2 }); // cross
        }
      }
    }

    function createWheel(cx, cy) {
      nodes = []; springs = [];
      const n = 16, r = 50;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        nodes.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: 0, vy: 0, pinned: false, mass: 1 });
      }
      nodes.push({ x: cx, y: cy, vx: 0, vy: 0, pinned: false, mass: 3 }); // hub
      const hub = nodes.length - 1;
      for (let i = 0; i < n; i++) {
        springs.push({ a: i, b: (i + 1) % n });
        springs.push({ a: i, b: hub }); // spokes
        springs.push({ a: i, b: (i + 2) % n });
      }
    }

    function createCube(cx, cy) {
      nodes = []; springs = [];
      const s = 50;
      const pts = [[-1,-1],[1,-1],[1,1],[-1,1]];
      for (const [px, py] of pts) {
        nodes.push({ x: cx + px * s/2, y: cy + py * s/2, vx: 0, vy: 0, pinned: false, mass: 1 });
      }
      // Edges + diagonals
      springs.push({ a: 0, b: 1 }, { a: 1, b: 2 }, { a: 2, b: 3 }, { a: 3, b: 0 });
      springs.push({ a: 0, b: 2 }, { a: 1, b: 3 });
    }

    function createShape() {
      const shape = shapes[shapeIdx];
      const cx = W / 2, cy = H / 3;
      if (shape === 'blob') createBlob(cx, cy);
      else if (shape === 'worm') createWorm(cx - 80, cy);
      else if (shape === 'wheel') createWheel(cx, cy);
      else createCube(cx, cy);
      // Compute rest lengths
      for (const s of springs) {
        const a = nodes[s.a], b = nodes[s.b];
        s.restLen = Math.hypot(a.x - b.x, a.y - b.y);
      }
    }

    sl('btn-shape').addEventListener('click', function() {
      shapeIdx = (shapeIdx + 1) % shapes.length;
      this.textContent = `Shape: ${shapes[shapeIdx].charAt(0).toUpperCase() + shapes[shapeIdx].slice(1)}`;
      createShape();
    });

    sl('btn-drop').addEventListener('click', () => {
      nodes.forEach(n => { n.y -= 150; n.vy = 0; n.vx = 0; });
    });

    sl('btn-throw').addEventListener('click', () => {
      nodes.forEach(n => { n.vx += (Math.random() - 0.5) * 400; n.vy -= 200 + Math.random() * 200; });
    });

    sl('btn-reset').addEventListener('click', createShape);

    // Mouse interaction
    let mouseX = 0, mouseY = 0;
    canvas.addEventListener('mousedown', (e) => {
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      for (let i = 0; i < nodes.length; i++) {
        if (Math.hypot(nodes[i].x - mx, nodes[i].y - my) < 15) {
          grabbed = i;
          break;
        }
      }
    });
    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
    });
    canvas.addEventListener('mouseup', () => { grabbed = null; });
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      for (const n of nodes) {
        if (Math.hypot(n.x - mx, n.y - my) < 15) { n.pinned = !n.pinned; break; }
      }
    });

    const dt = 0.016;
    const substeps = 8;

    function simulate() {
      const stiffness = +stiffEl.value;
      const damping = +dampEl.value;
      const gravity = +gravEl.value;
      const subDt = dt / substeps;

      for (let s = 0; s < substeps; s++) {
        // Spring forces
        for (const sp of springs) {
          const a = nodes[sp.a], b = nodes[sp.b];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.max(0.1, Math.sqrt(dx * dx + dy * dy));
          const force = stiffness * (dist - sp.restLen) / dist;
          const fx = force * dx, fy = force * dy;

          // Damping
          const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
          const dampF = damping * (dvx * dx + dvy * dy) / (dist * dist);

          if (!a.pinned) { a.vx += (fx + dampF * dx) * subDt / a.mass; a.vy += (fy + dampF * dy) * subDt / a.mass; }
          if (!b.pinned) { b.vx -= (fx + dampF * dx) * subDt / b.mass; b.vy -= (fy + dampF * dy) * subDt / b.mass; }
        }

        // Gravity + integration
        for (const n of nodes) {
          if (n.pinned) { n.vx = 0; n.vy = 0; continue; }
          n.vy += gravity * subDt;
          n.x += n.vx * subDt;
          n.y += n.vy * subDt;

          // Ground collision
          if (n.y > groundY) {
            n.y = groundY;
            n.vy *= -0.5;
            n.vx *= 0.95;
          }
          // Walls
          if (n.x < 10) { n.x = 10; n.vx *= -0.5; }
          if (n.x > W - 10) { n.x = W - 10; n.vx *= -0.5; }
          if (n.y < 10) { n.y = 10; n.vy *= -0.5; }
        }

        // Grabbed node
        if (grabbed !== null && !nodes[grabbed].pinned) {
          const n = nodes[grabbed];
          n.vx = (mouseX - n.x) * 20;
          n.vy = (mouseY - n.y) * 20;
          n.x = mouseX;
          n.y = mouseY;
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, W, H);

      // Ground
      ctx.fillStyle = '#141414';
      ctx.fillRect(0, groundY, W, H - groundY);
      ctx.strokeStyle = '#1f1f1f'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

      // Springs
      for (const sp of springs) {
        const a = nodes[sp.a], b = nodes[sp.b];
        const strain = Math.abs(Math.hypot(a.x - b.x, a.y - b.y) - sp.restLen) / sp.restLen;
        const r = Math.min(255, Math.round(strain * 800));
        ctx.strokeStyle = `rgb(${150 + r}, ${100 - r/3}, ${50})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }

      // Nodes
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        ctx.fillStyle = n.pinned ? '#ef4444' : grabbed === i ? '#10b981' : '#f97316';
        ctx.beginPath(); ctx.arc(n.x, n.y, n.mass > 1 ? 6 : 4, 0, Math.PI * 2); ctx.fill();
        if (n.pinned) {
          ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(n.x, n.y, 8, 0, Math.PI * 2); ctx.stroke();
        }
      }

      // Fill shape
      if (nodes.length > 3) {
        ctx.fillStyle = 'rgba(249, 115, 22, 0.06)';
        ctx.beginPath();
        // Find outer nodes (first N for blob/wheel, all for cube)
        const outer = shapes[shapeIdx] === 'cube' ? [0,1,2,3] :
          shapes[shapeIdx] === 'worm' ? [...Array(nodes.length).keys()] :
          [...Array(nodes.length - 1).keys()];
        if (outer.length > 2) {
          ctx.moveTo(nodes[outer[0]].x, nodes[outer[0]].y);
          for (let i = 1; i < outer.length; i++) ctx.lineTo(nodes[outer[i]].x, nodes[outer[i]].y);
          ctx.closePath(); ctx.fill();
        }
      }
    }

    function loop() { requestAnimationFrame(loop); simulate(); draw(); }
    createShape();
    loop();
  </script>
</body>
</html>
