name = "freerobotstore-host"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = false

[[routes]]
pattern = "freerobotstore.online/*"
zone_name = "freerobotstore.online"

[[routes]]
pattern = "*.freerobotstore.online/*"
zone_name = "freerobotstore.online"

[vars]
GITHUB_CLIENT_ID = "Ov23linoTyxg6znK9LmO"

[[r2_buckets]]
binding = "AGENTS"
bucket_name = "frs-robots"

[durable_objects]
bindings = [
  { name = "MIRROR_ROOMS", class_name = "MirrorRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["MirrorRoom"]

[[d1_databases]]
binding = "DB"
database_name = "frs"
database_id = "8a017de8-b5f3-41d4-8577-236635713011"
migrations_dir = "migrations"
